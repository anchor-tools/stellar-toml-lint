apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-broken
spec:
  acme:
    server: http://acme-v01.api.letsencrypt.org/directory
    email: expired@example.com
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: anchor-broken
  namespace: anchors
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-missing
    nginx.ingress.kubernetes.io/enable-cors: 'false'
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - anchor.example.com
      secretName: anchor-tls
  rules:
    - host: anchor.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: anchor
                port:
                  number: 80
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: anchor-tls
  namespace: anchors
spec:
  secretName: other-tls
  issuerRef:
    name: letsencrypt-missing
    kind: ClusterIssuer
  dnsNames:
    - anchor.example.com
