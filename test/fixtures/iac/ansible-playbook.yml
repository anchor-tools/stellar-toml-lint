---
- name: Configure Anchor Server
  hosts: anchors
  tasks:
    - name: Deploy stellar.toml
      copy:
        src: stellar.toml
        dest: /var/www/html/.well-known/stellar.toml

    - name: Configure Nginx with SSL and CORS
      template:
        src: nginx.conf.j2
        dest: /etc/nginx/sites-available/anchor
      notify: reload nginx
