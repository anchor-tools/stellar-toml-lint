name: 'Stellar Info File (SEP-1) Lint'
description: 'Validate a stellar.toml against SEP-1, with inline PR annotations and optional SARIF upload.'
author: 'stellar-toml-lint contributors'

branding:
  icon: 'check-circle'
  color: 'blue'

inputs:
  file:
    description: 'Path to the stellar.toml to lint.'
    required: false
    default: 'stellar.toml'
  domain:
    description: >-
      Domain serving the file. When set without `file`, the action fetches
      https://<domain>/.well-known/stellar.toml and additionally checks CORS,
      content type, and that ORG_URL matches the serving host.
    required: false
  strict:
    description: 'Treat warnings as errors.'
    required: false
    default: 'false'
  max-warnings:
    description: 'Fail if the warning count exceeds this number.'
    required: false
  check-network:
    description: 'Run opt-in network checks against the configured file.'
    required: false
    default: 'false'
  crawl-peers:
    description: 'Discover and audit validator overlay peers.'
    required: false
    default: 'false'
  verify-dnssec:
    description: 'Compare DNSSEC-validating DNS resolvers for the anchor domain.'
    required: false
    default: 'false'
  format:
    description: 'Output format: github, text, json, ndjson, sarif, junit, or checkstyle.'
    required: false
    default: 'github'
  sarif-file:
    description: 'Also write SARIF to this path, for upload to code scanning.'
    required: false
  pr-comment:
    description: >-
      Post or update an aggregated Markdown summary comment on the pull request
      (Pass/Fail badge, Wallet Readiness grade, breaking changes, collapsible
      suggestions). No effect outside pull-request contexts.
    required: false
    default: 'false'

outputs:
  exit-code:
    description: 'The linter exit code: 0 clean, 1 problems found.'
    value: ${{ steps.run.outputs.exit-code }}

runs:
  using: composite
  steps:
    - name: Run stellar-toml-lint
      id: run
      shell: bash
      env:
        INPUT_FILE: ${{ inputs.file }}
        INPUT_DOMAIN: ${{ inputs.domain }}
        INPUT_STRICT: ${{ inputs.strict }}
        INPUT_MAX_WARNINGS: ${{ inputs.max-warnings }}
        INPUT_CHECK_NETWORK: ${{ inputs.check-network }}
        INPUT_CRAWL_PEERS: ${{ inputs.crawl-peers }}
        INPUT_VERIFY_DNSSEC: ${{ inputs.verify-dnssec }}
        INPUT_FORMAT: ${{ inputs.format }}
        INPUT_SARIF_FILE: ${{ inputs.sarif-file }}
        INPUT_PR_COMMENT: ${{ inputs.pr-comment }}
      run: |
        set -uo pipefail

        args=()
        # A domain on its own means "lint the live site"; with a file it only
        # supplies the host for the same-domain checks.
        if [[ -n "$INPUT_DOMAIN" ]]; then
          args+=(--domain "$INPUT_DOMAIN")
          [[ -f "$INPUT_FILE" ]] && args+=("$INPUT_FILE")
        else
          args+=("$INPUT_FILE")
        fi

        [[ "$INPUT_STRICT" == "true" ]] && args+=(--strict)
        [[ -n "$INPUT_MAX_WARNINGS" ]] && args+=(--max-warnings "$INPUT_MAX_WARNINGS")
        [[ "$INPUT_CHECK_NETWORK" == "true" ]] && args+=(--check-network)
        [[ "$INPUT_CRAWL_PEERS" == "true" ]] && args+=(--crawl-peers)
        [[ "$INPUT_VERIFY_DNSSEC" == "true" ]] && args+=(--verify-dnssec)

        if [[ -n "$INPUT_SARIF_FILE" ]]; then
          npx --yes stellar-toml-lint@latest "${args[@]}" --format sarif > "$INPUT_SARIF_FILE" || true
        fi

        if [[ "$INPUT_PR_COMMENT" == "true" ]]; then
          npx --yes stellar-toml-lint@latest "${args[@]}" --format pr-comment > .stellar-toml-lint-pr-comment.md || true
        fi

        npx --yes stellar-toml-lint@latest "${args[@]}" --format "$INPUT_FORMAT"
        code=$?
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        exit $code

    - name: Post pull-request summary comment
      id: pr-comment
      # `always()` because the lint step above exits non-zero exactly when
      # reviewers most need the comment: on findings. The verdict itself is
      # carried by that step's exit code (and the `exit-code` output); this
      # step only delivers the report and never fails the job on its own.
      if: always() && inputs.pr-comment == 'true' && github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');

          let body;
          try {
            body = fs.readFileSync('.stellar-toml-lint-pr-comment.md', 'utf8');
          } catch {
            core.warning('pr-comment output file not found; skipping the PR comment');
            return;
          }
          const marker = body.split('\n', 1)[0];
          if (!marker || !marker.startsWith('<!--')) {
            core.warning('pr-comment output is missing its identification marker; skipping');
            return;
          }

          // Exactly one listing plus one write per run keeps the job well
          // inside the GitHub API rate limits.
          try {
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });

            const existing = comments.find(
              (c) => c.user?.login === 'github-actions[bot]' && (c.body ?? '').includes(marker),
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
              core.info(`Updated existing comment ${existing.id}`);
            } else {
              const { data: created } = await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
              core.info(`Created comment ${created.id}`);
            }
          } catch (error) {
            // Missing `pull-requests: write`, a rate limit, or a network
            // hiccup must not fail the job: the lint verdict stands on its own.
            core.warning(`Could not post the PR comment: ${error.message}`);
          }
