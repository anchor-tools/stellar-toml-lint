[package]
name = "stellar-toml-zed"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Official Zed extension for stellar.toml, backed by stellar-toml-lint"
repository = "https://github.com/anchor-tools/stellar-toml-lint"

[lib]
crate-type = ["cdylib"]

[dependencies]
zed_extension_api = "0.1.0"

[profile.release]
opt-level = "s"
lto = true
strip = true
