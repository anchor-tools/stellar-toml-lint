name = "Stellar TOML"
grammar = "stellar-toml"
path_suffixes = ["stellar.toml", ".stellar.toml"]
line_comments = ["# "]
autoclose_before = ",]}"
brackets = [
  { start = "{", end = "}", close = true, newline = true },
  { start = "[", end = "]", close = true, newline = true },
  { start = "\"", end = "\"", close = true, newline = false, not_in = ["string", "comment"] },
  { start = "'", end = "'", close = true, newline = false, not_in = ["string", "comment"] },
]
