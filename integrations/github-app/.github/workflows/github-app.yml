name: GitHub App CI

on:
  push:
    branches: [feature/github-app-bot]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: integrations/github-app/package-lock.json

      - run: cd integrations/github-app && npm ci
      - run: cd integrations/github-app && npm run build
      - run: cd integrations/github-app && npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: integrations/github-app/package-lock.json
      - run: cd integrations/github-app && npm ci
      - run: cd integrations/github-app && npm run build
