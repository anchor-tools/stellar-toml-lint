version: 2.1
description: Run stellar-toml-lint in CircleCI with cached installation and CI reports.

commands:
  install_cli:
    parameters:
      version:
        type: string
        default: latest
    steps:
      - restore_cache:
          keys:
            - stellar-toml-lint-npm-v1-<< parameters.version >>
      - run:
          name: Install stellar-toml-lint
          command: npm install --global stellar-toml-lint@<< parameters.version >>
      - save_cache:
          key: stellar-toml-lint-npm-v1-<< parameters.version >>
          paths:
            - ~/.npm

  publish_reports:
    parameters:
      path:
        type: string
      flags:
        type: string
        default: ''
      report_name:
        type: string
        default: stellar-toml-lint
    steps:
      - run:
          name: Lint and generate JUnit/SARIF reports
          command: |
            mkdir -p test-results
            set +e
            stellar-toml-lint "<< parameters.path >>" << parameters.flags >> --format junit > "test-results/<< parameters.report_name >>.xml"
            lint_status=$?
            stellar-toml-lint "<< parameters.path >>" << parameters.flags >> --format sarif > "test-results/<< parameters.report_name >>.sarif"
            sarif_status=$?
            set -e
            if [ "$lint_status" -ne 0 ]; then exit "$lint_status"; fi
            exit "$sarif_status"
      - store_test_results:
          path: test-results
      - store_artifacts:
          path: test-results
          destination: stellar-toml-lint-reports

jobs:
  lint:
    parameters:
      path:
        type: string
        default: stellar.toml
      strict:
        type: boolean
        default: false
      check_network:
        type: boolean
        default: false
      version:
        type: string
        default: latest
    docker:
      - image: cimg/node:22.0
    steps:
      - checkout
      - install_cli:
          version: << parameters.version >>
      - publish_reports:
          path: << parameters.path >>
          report_name: stellar-toml-lint
          flags: >-
            <<# parameters.strict >>--strict<</ parameters.strict >>
            <<# parameters.check_network >>--check-network<</ parameters.check_network >>

  network-audit:
    parameters:
      path:
        type: string
        default: stellar.toml
      strict:
        type: boolean
        default: false
      version:
        type: string
        default: latest
    docker:
      - image: cimg/node:22.0
    steps:
      - checkout
      - install_cli:
          version: << parameters.version >>
      - publish_reports:
          path: << parameters.path >>
          report_name: stellar-toml-network-audit
          flags: >-
            --check-network
            --audit-security
            <<# parameters.strict >>--strict<</ parameters.strict >>
