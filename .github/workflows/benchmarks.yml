name: Benchmarks

# Performance is a feature of a linter that runs on every push in other
# people's pipelines, so it gets the same treatment as correctness: a gate on
# pull requests, and a scheduled run so a dependency upgrade that slows the
# rules down is noticed without waiting for someone to open a PR.
on:
  push:
    branches: [main]
    # Documentation changes cannot regress a rule predicate.
    paths:
      - 'src/**'
      - 'benchmarks/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/benchmarks.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'benchmarks/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/benchmarks.yml'
  schedule:
    - cron: '41 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Benchmarks are timing-sensitive, so never let two runs of this workflow
  # share a runner's CPU. Superseded runs are cancelled rather than queued.
  group: benchmarks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  throughput:
    name: End-to-end throughput
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # The whole-file benchmark: parse and lint documents from 10KB to 5MB
      # against fixed per-size thresholds.
      #
      # Reported, not enforced. Those thresholds are absolute milliseconds
      # chosen on a developer's machine, and the largest case already measures
      # within 10% of its budget there — on a shared runner it would fail for
      # reasons that have nothing to do with the change under test. The
      # per-rule job below is the gate, because its comparison is normalised
      # and measured against a base built on the same runner. Recalibrating
      # these thresholds is worth doing, and is a change of its own.
      - name: Throughput thresholds (reported, not enforced)
        run: npm run bench
        continue-on-error: true

  rules:
    name: Per-rule regression suite
    runs-on: ubuntu-latest
    steps:
      # Two checkouts: the merge commit to measure, and the base commit to
      # measure *against*. Comparing against a freshly recorded base on this
      # same runner is what makes the comparison meaningful — a baseline
      # committed from a maintainer's laptop carries that machine's CPU, and
      # the numbers are not comparable across machines even after the
      # suite normalises them against its calibration workload.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # On a pull request, re-record the baseline from the base commit so the
      # comparison is PR-vs-base on one runner. On a push or a schedule there
      # is nothing to compare against, so the committed baseline is used.
      - name: Record baseline from the base commit
        if: github.event_name == 'pull_request'
        run: |
          git worktree add ../base "${{ github.event.pull_request.base.sha }}"
          cp -R node_modules ../base/node_modules
          ( cd ../base && npm run bench:regression -- --update )
          cp ../base/benchmarks/baselines/rule-latency.json benchmarks/baselines/rule-latency.json

      - name: Per-rule latency budgets and regression check
        id: bench
        run: npm run bench:regression -- --json > rule-latency.json
        continue-on-error: true

      # The human-readable table, always, so a failure is readable without
      # downloading an artifact.
      - name: Report
        if: always()
        run: npm run bench:regression || true

      - name: Upload measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rule-latency
          path: rule-latency.json
          if-no-files-found: warn

      # Timing on a shared runner is noisy enough that one flagged rule is not
      # proof. A second run has to agree before the job fails: a genuine
      # regression reproduces, a scheduling hiccup usually does not.
      - name: Confirm a flagged regression before failing
        if: steps.bench.outcome == 'failure'
        run: |
          echo "::warning::First run reported a regression; confirming before failing the job."
          npm run bench:regression
