name: CircleCI Orb

on:
  pull_request:
    paths:
      - integrations/circleci/**
      - .github/workflows/circleci-orb.yml
  push:
    branches: [main]
    tags: ['circleci-orb-v*']

permissions:
  contents: read

env:
  # Pinned and checksum-verified below. Bump both together.
  CIRCLECI_CLI_VERSION: 1.7.0
  CIRCLECI_CLI_SHA256: 3058f426a9da843087c2f8396d8f6e900e69779f47647d2f1209547cf63635fe

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Runs everywhere, including pull requests from forks, which never get
      # the CircleCI token the API validation below needs.
      - name: Check the orb structure offline
        run: node integrations/circleci/validate-orb.mjs integrations/circleci/orb.yml

      - name: Install the CircleCI CLI
        run: |
          archive="circleci-cli_${CIRCLECI_CLI_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/CircleCI-Public/circleci-cli/releases/download/v${CIRCLECI_CLI_VERSION}/${archive}"
          echo "${CIRCLECI_CLI_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" circleci
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Validate the orb with CircleCI
        env:
          CIRCLECI_CLI_TOKEN: ${{ secrets.CIRCLECI_CLI_TOKEN }}
        run: |
          if [ -z "${CIRCLECI_CLI_TOKEN}" ]; then
            echo "CIRCLECI_CLI_TOKEN is not available (pull request from a fork); the offline check above covered the orb."
            exit 0
          fi
          circleci orb validate integrations/circleci/orb.yml

      - name: Publish Orb release
        if: startsWith(github.ref, 'refs/tags/circleci-orb-v')
        env:
          CIRCLECI_CLI_TOKEN: ${{ secrets.CIRCLECI_CLI_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: circleci orb publish integrations/circleci/orb.yml "anchor-tools/stellar-toml-lint@${RELEASE_TAG#circleci-orb-v}"
