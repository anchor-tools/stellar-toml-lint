name: Release standalone binaries

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux x64 (glibc), os: ubuntu-latest, target: node20-linux-x64 }
          - { name: Linux x64 (musl), os: ubuntu-latest, target: node20-linuxstatic-x64 }
          - { name: Linux ARM64, os: ubuntu-24.04-arm, target: node20-linux-arm64 }
          - { name: macOS Intel, os: macos-13, target: node20-macos-x64 }
          - { name: macOS Apple Silicon, os: macos-14, target: node20-macos-arm64 }
          - { name: Windows x64, os: windows-latest, target: node20-win-x64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: npm }
      - run: npm ci
      - run: npm run build:binaries -- --target ${{ matrix.target }}
      - name: Verify standalone binary
        shell: bash
        run: |
          binary="$(find release -maxdepth 1 -type f | head -n 1)"
          # setup-node installs outside this path, so this proves the packaged
          # executable does not fall back to a host Node.js runtime.
          env -i PATH=/usr/bin:/bin HOME="$HOME" "$binary" --version
          env -i PATH=/usr/bin:/bin HOME="$HOME" "$binary" --help
          test "$(wc -c < "$binary")" -lt 47185920
      - name: Package release archive
        shell: bash
        run: |
          binary="$(find release -maxdepth 1 -type f | head -n 1)"
          tar -czf "${binary}.tar.gz" -C release "$(basename "$binary")"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: release/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Generate checksums
        working-directory: release
        run: sha256sum stellar-toml-lint-* > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with: { generate_release_notes: true, files: release/* }
