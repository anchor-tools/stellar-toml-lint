name: Release standalone binaries

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # `asset` is the public release asset base name. It is what README.md
          # and packaging/homebrew/stellar-toml-lint.rb download, so it is pinned
          # here instead of being derived from the pkg output filename.
          - name: Linux x64 (glibc)
            os: ubuntu-latest
            target: node20-linux-x64
            asset: stellar-toml-lint-linux-x64
          - name: Linux x64 (musl)
            os: ubuntu-latest
            target: node20-linuxstatic-x64
            asset: stellar-toml-lint-linux-x64-musl
          - name: Linux ARM64
            os: ubuntu-24.04-arm
            target: node20-linux-arm64
            asset: stellar-toml-lint-linux-arm64
          - name: macOS Intel
            os: macos-13
            target: node20-macos-x64
            asset: stellar-toml-lint-macos-x64
          - name: macOS Apple Silicon
            os: macos-14
            target: node20-macos-arm64
            asset: stellar-toml-lint-macos-arm64
          - name: Windows x64
            os: windows-latest
            target: node20-win-x64
            asset: stellar-toml-lint-windows-x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: npm }
      - run: npm ci
      - run: npm run build:binaries -- --target ${{ matrix.target }}
      - name: Verify standalone binary
        shell: bash
        run: |
          binary="$(find release -maxdepth 1 -type f ! -name '*.tar.gz' | sort | head -n 1)"
          test -n "$binary"
          # setup-node installs outside this path, so this proves the packaged
          # executable does not fall back to a host Node.js runtime.
          env -i PATH=/usr/bin:/bin HOME="$HOME" "$binary" --version
          env -i PATH=/usr/bin:/bin HOME="$HOME" "$binary" --help
          test "$(wc -c < "$binary")" -lt 47185920
      - name: Package release archive
        shell: bash
        run: |
          binary="$(find release -maxdepth 1 -type f ! -name '*.tar.gz' | sort | head -n 1)"
          test -n "$binary"
          archive="${{ matrix.asset }}.tar.gz"
          # The archive name comes from `matrix.asset` so it always matches the
          # assets consumers and the Homebrew formula fetch, rather than being
          # derived from pkg's output (which appends `.exe` on Windows).
          tar -czf "release/$archive" -C release "$(basename "$binary")"
          echo "Packaged release/$archive containing $(basename "$binary")"
          tar -tzf "release/$archive"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: release/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Generate checksums
        working-directory: release
        run: sha256sum stellar-toml-lint-* > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with: { generate_release_notes: true, files: release/* }
