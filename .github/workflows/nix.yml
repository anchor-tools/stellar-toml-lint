name: Nix Flake Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nix-check:
    name: Nix Flake Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v16

      - name: Check flake
        run: nix build .#packages.x86_64-linux.default --show-trace

      - name: Test binary runs
        run: ./result/bin/stellar-toml-lint --version

  nix-build-multi-platform:
    name: Build on ${{ matrix.system }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-latest
          - system: x86_64-darwin
            runner: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v16

      - name: Build for ${{ matrix.system }}
        run: nix build .#packages.${{ matrix.system }}.default --show-trace
        env:
          NIX_PATH: nixpkgs=channel:nixos-unstable
