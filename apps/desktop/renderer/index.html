<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      A strict CSP, enforced by the page as well as by the window's
      `webPreferences`. The renderer loads a file:// document and talks to the
      main process over IPC only, so it needs no network access at all —
      `default-src 'none'` with explicit additions is the version of this
      header that stays correct when someone later adds a feature.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; form-action 'none'; base-uri 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Stellar TOML Lint</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #11131a;
        --panel: #181b24;
        --border: #272c38;
        --text: #e6e8ee;
        --muted: #9aa1b1;
        --ok: #1f9d55;
        --warn: #c98a04;
        --error: #d13438;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font:
          14px/1.5 ui-sans-serif,
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
      }
      header {
        display: flex;
        gap: 12px;
        align-items: center;
        flex-wrap: wrap;
        padding: 16px 20px;
        border-bottom: 1px solid var(--border);
      }
      h1 {
        font-size: 15px;
        font-weight: 600;
        margin: 0;
        margin-right: auto;
      }
      button {
        font: inherit;
        color: var(--text);
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 6px 12px;
        cursor: pointer;
      }
      button:hover:not(:disabled) {
        border-color: #3a4152;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      main {
        padding: 20px;
      }
      #folder {
        font-family: ui-monospace, 'SF Mono', Menlo, monospace;
        font-size: 12px;
        color: var(--muted);
        word-break: break-all;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 3px 9px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 600;
      }
      .badge::before {
        content: '';
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: currentColor;
      }
      .ok {
        color: var(--ok);
        background: rgb(31 157 85 / 0.14);
      }
      .warning {
        color: var(--warn);
        background: rgb(201 138 4 / 0.14);
      }
      .error {
        color: var(--error);
        background: rgb(209 52 56 / 0.14);
      }
      .idle,
      .scanning {
        color: var(--muted);
        background: rgb(154 161 177 / 0.14);
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th,
      td {
        text-align: left;
        padding: 9px 12px;
        border-bottom: 1px solid var(--border);
      }
      th {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--muted);
        font-weight: 600;
      }
      td.num {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      tr.has-errors td.num.errors {
        color: var(--error);
        font-weight: 600;
      }
      .path {
        font-family: ui-monospace, 'SF Mono', Menlo, monospace;
        font-size: 12px;
        background: none;
        border: none;
        padding: 0;
        color: var(--text);
        text-decoration: underline;
        text-decoration-color: var(--border);
        cursor: pointer;
      }
      .empty {
        color: var(--muted);
        padding: 32px 0;
        text-align: center;
      }
      #failure {
        margin: 0 20px 16px;
        padding: 10px 12px;
        border: 1px solid var(--error);
        border-radius: 6px;
        color: var(--error);
        font-size: 13px;
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Stellar TOML Lint</h1>
      <span id="status" class="badge idle">Not watching</span>
      <button id="choose" type="button">Choose folder…</button>
      <button id="rescan" type="button" disabled>Rescan</button>
      <button id="stop" type="button" disabled>Stop</button>
    </header>
    <p id="failure" hidden></p>
    <main>
      <p id="folder">No folder watched. Choose one to start monitoring.</p>
      <table id="results" hidden>
        <thead>
          <tr>
            <th>File</th>
            <th class="num">Errors</th>
            <th class="num">Warnings</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
      <p id="empty" class="empty" hidden>No .toml files found in this folder.</p>
    </main>
    <script src="./renderer.js"></script>
  </body>
</html>
